<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maya’s Learning · Maya Maths</title><style>
:root{--navy:#17324d;--blue:#347fb8;--green:#31875d;--cream:#fffaf0;--line:#d8e4ed;--muted:#60788d}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Trebuchet MS",Arial,sans-serif;color:var(--navy);background:linear-gradient(135deg,var(--cream),#eef7ff 70%)}header{padding:16px 22px;background:#ffffffd9;border-bottom:1px solid var(--line)}main{width:min(850px,calc(100% - 28px));margin:40px auto}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:25px;box-shadow:0 12px 30px #17324d16}.hidden{display:none!important}.setup{max-width:560px;margin:auto}input{font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;width:100%;margin:8px 0}button{font:inherit;font-weight:900;border:0;border-radius:11px;padding:12px 16px;background:var(--blue);color:#fff}.choices{display:grid;grid-template-columns:1fr 1fr;gap:18px}.choice{display:flex;flex-direction:column;min-height:250px;border-radius:22px;padding:24px;text-decoration:none;color:var(--navy);border:1px solid var(--line);background:#fff}.choice:last-child{background:#eef8f2}.choice h2{font-size:2rem}.go{margin-top:auto;background:var(--blue);color:#fff;border-radius:12px;padding:12px;text-align:center;font-weight:900}.choice:last-child .go{background:var(--green)}.muted{color:var(--muted);line-height:1.5}.notice{background:#eef7ff;padding:12px;border-radius:11px}@media(max-width:650px){.choices{grid-template-columns:1fr}}</style></head><body>
<header><strong>🧩 Maya Maths</strong></header><main><section id="setup" class="card setup hidden"><h1>Set up Maya’s learning</h1><p class="muted">A parent enters Maya’s private device code once. Maya will not need to sign in each time.</p><input id="learnerCode" type="password" placeholder="Private device code"><button id="authorise">Authorise this device</button><p id="setupMessage" class="muted"></p></section>
<section id="learning" class="hidden"><div class="card"><h1>Welcome back, Maya! ✨</h1><p id="programmeSummary" class="notice">Loading today’s programme…</p></div><div class="choices"><a class="choice" href="multiplication.html?mode=learner&cloud=1"><span style="font-size:3rem">✖️</span><h2>Multiplication</h2><p id="multiplicationSummary" class="muted"></p><span class="go">Start Multiplication</span></a><a id="fractionsCard" class="choice" href="fractions.html?mode=learner&cloud=1"><span style="font-size:3rem">🍕</span><h2>Fractions</h2><p id="fractionsSummary" class="muted"></p><span class="go">Start Fractions</span></a></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3"></script><script src="cloud-config.js"></script><script src="cloud.js"></script><script>
const $=s=>document.querySelector(s);async function openLearning(){try{let a=await MayaCloud.assignment(),sel=a.multiplication?.selections||{},facts=Object.values(sel).reduce((n,x)=>n+x.length,0),fr=Array.isArray(a.fractions)?a.fractions:[];$('#setup').classList.add('hidden');$('#learning').classList.remove('hidden');$('#programmeSummary').textContent=`Today: ${facts} multiplication facts${fr.length?' and '+fr.length+' fractions lesson'+(fr.length===1?'':'s'):''}.`;$('#multiplicationSummary').textContent=Object.entries(sel).map(([f,x])=>`×${f}: ${x.join(', ')}`).join(' · ')||'No facts assigned.';$('#fractionsSummary').textContent=fr.length?`${fr.length} assigned lesson${fr.length===1?'':'s'} ready.`:'No Fractions lesson assigned today.';$('#fractionsCard').style.opacity=fr.length?'1':'.55'}catch(e){$('#setup').classList.remove('hidden');$('#setupMessage').textContent='This device is not authorised yet.'}}
async function start(){try{let s=await MayaCloud.session();if(!s&&localStorage.getItem('maya_cloud_learner'))await MayaCloud.ensureAnonymous();await openLearning()}catch{$('#setup').classList.remove('hidden')}}
$('#authorise').onclick=async()=>{let code=$('#learnerCode').value.trim();if(!code)return;$('#setupMessage').textContent='Authorising…';try{await MayaCloud.claimLearner(code);await openLearning()}catch(e){$('#setupMessage').textContent='The code was not recognised. Please ask a parent to check it.'}};start();
</script></body></html>
